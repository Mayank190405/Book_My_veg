version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bmv-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: bookmyveg
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bmv-redis
    restart: always
    ports:
      - '6379:6379'

  server:
    image: 071370395808.dkr.ecr.ap-south-1.amazonaws.com/bmv-server:v704
    container_name: bmv-server
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@db:5432/bookmyveg?schema=public&sslmode=disable
      JWT_SECRET: supersecret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_SSL: 'false'
      PORT: 5000
      CLIENT_URL: https://bookmyveg.co.in
      # WhatsApp
      MBGCARD_API_URL: "https://chatbot.digitalmbg.com/v1/whatsapp/send_templet"
      MBGCARD_API_TOKEN: "8a69233a0b157de55739255688858785"
      MBGCARD_PHONE_NUMBER_ID: "1584781019502734"
      MBGCARD_TEMPLATE_ID: "login"
      # Juspay
      JUSPAY_API_KEY: "5937E82C95F4CEB9F9BEAEE5EE99EA"
      JUSPAY_MERCHANT_ID: "SG4270"
      JUSPAY_CLIENT_ID: "hdfcmaster"
      JUSPAY_BASE_URL: "https://smartgateway.hdfcuat.bank.in"
      JUSPAY_RESPONSE_KEY: "5C9DCDC9768451CAD87DAFA5213641"
      JUSPAY_ENCODING_KEY: "00816F675194A55BEACC1F42909EDF"
    ports:
      - '5000:5000'
    depends_on:
      - db
      - redis

  client:
    image: 071370395808.dkr.ecr.ap-south-1.amazonaws.com/bmv-client:v704
    container_name: bmv-client
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: https://bookmyveg.co.in/api/v1
    depends_on:
      - server

volumes:
  postgres_data:
