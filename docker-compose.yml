
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bmv-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-bookmyveg}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: bmv-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_password}@db:5432/${DB_NAME:-bookmyveg}?schema=public
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 5000
    depends_on:
      - db
      - redis
    volumes:
      - ./server/.env:/app/.env

  redis:
    image: redis:7-alpine
    container_name: bmv-redis
    restart: always
    ports:
      - "6379:6379"

  client:
    build: ./client
    container_name: bmv-client
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
      NODE_ENV: production
    depends_on:
      - server

volumes:
  postgres_data:
