
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bmv-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-bookmyveg}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: bmv-server
    restart: always
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_password}@db:5432/${DB_NAME:-bookmyveg}?schema=public
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 5000
      JWT_ACCESS_EXPIRY: 7d
      JWT_REFRESH_EXPIRY: 30d
      CLIENT_URL: ${CLIENT_URL:-https://bookmyveg.co.in}
    depends_on:
      - db
      - redis
    volumes:
      - bmv-uploads:/app/public/uploads

  redis:
    image: redis:7
    container_name: bmv-redis
    restart: always
    ports:
      - "6385:6379"

  client:
    build:
      context: ./client
      args:
        - INTERNAL_SERVER_URL=http://server:5000
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5001/api/v1}
    container_name: bmv-client
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001/api/v1}
      INTERNAL_SERVER_URL: http://server:5000
      NODE_ENV: production
    depends_on:
      - server

  easebuzz:
    build:
      context: ./paywitheasebuzz-nodejs-lib/Easebuzz_NodeJS_kit
    container_name: bmv-easebuzz
    restart: always
    ports:
      - "3003:3000"
    environment:
      EASEBUZZ_MERCHANT_KEY: ${EASEBUZZ_MERCHANT_KEY}
      EASEBUZZ_SALT: ${EASEBUZZ_SALT}
      ENV: ${EASEBUZZ_ENV:-test}
      HOST: 0.0.0.0
      PORT: 3000

volumes:
  postgres_data:
  bmv-uploads:

